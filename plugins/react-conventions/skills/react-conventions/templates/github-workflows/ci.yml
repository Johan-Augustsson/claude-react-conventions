name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Skip until the app is scaffolded (no package.json yet)
      - name: Check for app
        id: app
        run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.app.outputs.exists == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: npm run lint

      - name: Check formatting
        if: steps.app.outputs.exists == 'true'
        run: npm run format:check

      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm run build
